# Test coverage of main (report only), outside ci.yml so that neither a pull request nor
# the release gate (a successful push run of ci.yml) waits for it. The tests themselves
# run in ci.yml's `test` job; this instrumented run repeats them on PostgreSQL 17 for the
# report. To enforce a gate, append `--fail-under-lines 80` to the command below.
#
# Like ci.yml: no third-party actions, sources fetched with plain git, the job inside the
# rust image on a GitHub-hosted runner. Network egress needed: git host, crates.io, Debian
# mirrors, Docker Hub, github.com (the cargo-llvm-cov release).

name: coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  coverage:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only credentials for the service container above.
      DESKHAVEN_TEST_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_test
      DESKHAVEN_TEST_REQUIRE_PG: "1"
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q -f FETCH_HEAD
      - run: .github/ci-setup.sh cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      - run: cargo llvm-cov --workspace --all-targets --no-fail-fast --summary-only
