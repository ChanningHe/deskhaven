# The rust image tag in each job must match the channel in rust-toolchain.toml.
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_NEXTEST_VERSION: "0.9.136"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  CI_FETCH_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
  CI_FALLBACK_REF: ${{ github.ref }}

jobs:
  fmt:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: CI_SKIP_APT=1 .github/ci-setup.sh
      - run: cargo fmt --all -- --check

  relay-key-guard:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: CI_SKIP_APT=1 .github/ci-setup.sh
      - run: rustfmt --check --edition 2021 deploy/docker/relay-key-guard.rs
      - name: clippy (program and tests)
        run: |
          clippy-driver --edition 2021 --crate-type bin -D warnings --emit=metadata -o /tmp/guard.rmeta deploy/docker/relay-key-guard.rs
          clippy-driver --edition 2021 --test -D warnings --emit=metadata -o /tmp/guard-test.rmeta deploy/docker/relay-key-guard.rs
      - name: tests
        run: |
          rustc --edition 2021 --test -o /tmp/guard-tests deploy/docker/relay-key-guard.rs
          /tmp/guard-tests

  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - name: git-cliff (pinned prebuilt binary, sha256 verified)
        if: runner.arch == 'X64'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  GIT_CLIFF_VERSION: "\(.*\)"$/\1/p' .github/workflows/release.yml)"
          [ -n "$version" ] || { echo "::error::GIT_CLIFF_VERSION not found in release.yml"; exit 1; }
          file="git-cliff-${version}-x86_64-unknown-linux-musl.tar.gz"
          grep -qF "$file" .github/release/tests/git-cliff.sha256 || { echo "::error::tests/git-cliff.sha256 has no entry for $file: update it with GIT_CLIFF_VERSION"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/orhun/git-cliff/releases/download/v${version}/${file}"
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/.github/release/tests/git-cliff.sha256")
          mkdir -p "$RUNNER_TEMP/git-cliff-bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/git-cliff-bin" --strip-components=1 "git-cliff-${version}/git-cliff"
          echo "$RUNNER_TEMP/git-cliff-bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/git-cliff-bin/git-cliff" --version
      - name: shellcheck
        run: shellcheck --shell=bash -x --source-path=SCRIPTDIR .github/ci-setup.sh .github/release/*.sh .github/release/tests/*.sh .github/release/tests/stubs/*
      - name: tests
        run: .github/release/tests/run-all.sh

  web:
    runs-on: ubuntu-latest
    container: node:24.21.0-bookworm
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - name: pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm i18n:check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - name: generated API client matches openapi.json
        working-directory: web
        run: |
          pnpm gen:api
          git status --porcelain -- src/api/generated
          test -z "$(git status --porcelain -- src/api/generated)"
      - name: build (and the committed route tree is current)
        working-directory: web
        run: |
          pnpm build
          git diff --exit-code -- src/routeTree.gen.ts

  clippy:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABEL || 'selfhosted') || 'ubuntu-latest' }}
    container:
      image: rust:1.99.1-bookworm
      volumes:
        - deskhaven-ci-registry:/usr/local/cargo/registry
        - deskhaven-ci-git:/usr/local/cargo/git
        - deskhaven-ci-target:/ci-target
    env:
      CARGO_TARGET_DIR: /ci-target/clippy
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: .github/ci-setup.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: CI_SKIP_APT=1 .github/ci-setup.sh cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check

  test:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABEL || 'selfhosted') || 'ubuntu-latest' }}
    container:
      image: rust:1.99.1-bookworm
      volumes:
        - deskhaven-ci-registry:/usr/local/cargo/registry
        - deskhaven-ci-git:/usr/local/cargo/git
        - deskhaven-ci-target:/ci-target
    services:
      pg16:
        image: postgres:16
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TARGET_DIR: /ci-target/test
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: .github/ci-setup.sh cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}
      - name: build the tests
        run: cargo nextest run --workspace --all-targets --no-run
      - name: tests (SQLite, PostgreSQL 16 and 17)
        shell: bash
        run: |
          set -uo pipefail
          suite() {
            local profile=ci
            if [ -n "$2" ]; then
              export DESKHAVEN_TEST_PG_URL="$2" DESKHAVEN_TEST_REQUIRE_PG=1
              profile=ci-pg
            fi
            cargo nextest run --profile "$profile" --workspace --all-targets >"$RUNNER_TEMP/test-$1.log" 2>&1
          }
          names=(sqlite pg16 pg17)
          urls=("" postgres://deskhaven:deskhaven@pg16:5432/deskhaven_test postgres://deskhaven:deskhaven@pg17:5432/deskhaven_test)
          pids=()
          for i in 0 1 2; do
            suite "${names[$i]}" "${urls[$i]}" &
            pids+=("$!")
          done
          status=0
          for i in 0 1 2; do
            name="${names[$i]}"
            if wait "${pids[$i]}"; then result=passed; else result=FAILED; status=1; fi
            echo "::group::$name: $result"
            cat "$RUNNER_TEMP/test-$name.log"
            echo "::endgroup::"
          done
          exit "$status"
      - run: cargo xtask gen-openapi --check
      - run: cargo xtask gen-strategy-catalog --check
      - run: cargo xtask docs --check

  e2e:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_e2e
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: .github/ci-setup.sh
      - name: node
        run: |
          case "$(dpkg --print-architecture)" in
            amd64) arch=x64 sha=6e1db87ef58b8819e5d5402eff1536491b18edd8eb7bee5ef7897876e88dc5ff ;;
            arm64) arch=arm64 sha=724282c3b43aec998aa9527380465b45d229e021b58035f5f4f63095eabfe5d5 ;;
            *) echo "unsupported architecture" >&2; exit 1 ;;
          esac
          tarball="node-v$NODE_VERSION-linux-$arch.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/$tarball"
          echo "$sha  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local --strip-components=1
          rm "$tarball"
          node --version
      - name: pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          pnpm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm build
        working-directory: web
      - run: cargo build -p deskhaven
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: e2e (SQLite)
        id: e2e-sqlite
        run: pnpm e2e
        working-directory: web
      - name: e2e (PostgreSQL)
        if: ${{ !cancelled() && steps.e2e-sqlite.conclusion != 'skipped' }}
        run: pnpm e2e
        working-directory: web
        env:
          DESKHAVEN_E2E_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_e2e
      - name: upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/e2e-results
          retention-days: 14
