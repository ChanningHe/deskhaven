# GitHub Actions CI for deskhaven.
#
# No JavaScript actions are used, except the e2e job's failure upload (that job installs
# node; the action is pinned by commit): the job image (rust:*-bookworm) has no node.
# Sources are fetched with plain git (the repository is public; a private repo would need
# a token passed to the checkout step).
#
# Runners: the Rust jobs fmt, clippy, deny and test run on the self-hosted runner (label
# `selfhosted`, one 32-core machine that takes one job at a time), the rest on
# `ubuntu-latest`: with a warm cache they skip the cold build that takes most of a job's
# time on GitHub's runners, and web, e2e and the release-script checks run there
# meanwhile. Set the repository variable CI_RUNNER_LABEL (Settings -> Secrets and
# variables -> Actions -> Variables) to send them elsewhere, e.g. `ubuntu-latest` while
# the self-hosted runner is down.
#
# Cache: those jobs mount Docker volumes for the cargo registry and git sources (over the
# image's CARGO_HOME, which stays where rustup expects it) and for their build directories
# (/ci-target, one CARGO_TARGET_DIR per job); .github/ci-setup.sh clears a build directory
# past CI_TARGET_MAX_GB. On a GitHub runner the volumes are new and empty every time. The
# self-hosted workspace persists between runs, so every checkout forces the commit and
# cleans untracked files.
#
# Only this repository's own code (a push, or a pull request from a branch of this
# repository) goes to the self-hosted runner; fork pull requests stay on `ubuntu-latest`.
# That expression protects nothing: a pull request runs the workflow file from its own
# branch, so a fork can set `runs-on` to the self-hosted label and run any code there, and
# could also leave something in the shared cache for later builds. No change to this file
# can close that. A self-hosted runner on this public repository therefore needs
# "Require approval for all external contributors" (Settings -> Actions -> General ->
# Approval for running fork pull request workflows; set) and a maintainer who reads every
# fork workflow before approving it.
#
# Pipeline: every job starts at once, none waits for another. `test` builds the test
# binaries once and runs them on SQLite, PostgreSQL 16 and 17 side by side; coverage is
# coverage.yml (main only, report only), so nothing here waits for it.
# Releases (tags) are built by release.yml.
# The container image tag (repeated per job) must match the channel in rust-toolchain.toml.
# Network egress needed: git host, crates.io, Debian mirrors, Docker Hub,
# github.com (cargo-deny fetches the RustSec advisory DB from GitHub),
# registry.npmjs.org (web, e2e), and for e2e nodejs.org, the Playwright browser CDN
# (cdn.playwright.dev and its mirrors).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read: no job pushes, comments or publishes.
permissions:
  contents: read

env:
  # Tool versions, defined once.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Full debuginfo for every test binary fills a hosted runner's disk; line tables keep
  # file:line in backtraces at a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Warnings are denied in exactly one place: clippy `-D warnings` (with --all-targets it
  # also covers test code). No global RUSTFLAGS, so `cargo install` of tools is unaffected.
  #
  # Checkout inputs: PRs fetch refs/pull/N/head, pushes fetch the commit (ref as fallback).
  # The workspace belongs to the runner user while jobs run as root in their container, so
  # git refuses it ("dubious ownership") unless it is marked safe first.
  CI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  CI_FETCH_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
  CI_FALLBACK_REF: ${{ github.ref }}

jobs:
  fmt:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABEL || 'selfhosted') || 'ubuntu-latest' }}
    container:
      image: rust:1.99.1-bookworm
      # The persistent cache of the self-hosted runner (see the header); empty elsewhere.
      volumes:
        - deskhaven-ci-registry:/usr/local/cargo/registry
        - deskhaven-ci-git:/usr/local/cargo/git
        - deskhaven-ci-target:/ci-target
    env:
      CARGO_TARGET_DIR: /ci-target/fmt
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      # Toolchain only (rustfmt); no apt packages needed.
      - run: CI_SKIP_APT=1 .github/ci-setup.sh
      - run: cargo fmt --all -- --check

  # The relay key guard (deploy/docker/relay-key-guard.rs) is std-only and outside the
  # workspace, so no cargo job above compiles it, and its tests otherwise run only inside
  # the relay image build. Format, lint and test it here, with the same plain rustc the
  # image uses.
  relay-key-guard:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: CI_SKIP_APT=1 .github/ci-setup.sh
      - run: rustfmt --check --edition 2021 deploy/docker/relay-key-guard.rs
      - name: clippy (program and tests)
        run: |
          clippy-driver --edition 2021 --crate-type bin -D warnings --emit=metadata -o /tmp/guard.rmeta deploy/docker/relay-key-guard.rs
          clippy-driver --edition 2021 --test -D warnings --emit=metadata -o /tmp/guard-test.rmeta deploy/docker/relay-key-guard.rs
      - name: tests
        run: |
          rustc --edition 2021 --test -o /tmp/guard-tests deploy/docker/relay-key-guard.rs
          /tmp/guard-tests

  # The release scripts (.github/release/: what decides whether, what and where release.yml
  # publishes) are shellchecked and tested here, without network: gh, docker, git ls-remote
  # and cargo-audit are stubs (.github/release/tests/stubs). Runs on the runner itself, which
  # needs bash, git, jq, python3 >= 3.11 and shellcheck (all preinstalled on GitHub-hosted
  # ubuntu runners). git-cliff (for tests/test-cliff.sh) is the prebuilt release binary of the
  # version release.yml pins, its sha256 checked against tests/git-cliff.sha256 (bump that
  # file with GIT_CLIFF_VERSION); without it that test would skip itself. On a runner that is
  # not x86_64 the download is skipped and the test skips with a message.
  release-scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - name: git-cliff (pinned prebuilt binary, sha256 verified)
        if: runner.arch == 'X64'
        run: |
          set -euo pipefail
          version="$(sed -n 's/^  GIT_CLIFF_VERSION: "\(.*\)"$/\1/p' .github/workflows/release.yml)"
          [ -n "$version" ] || { echo "::error::GIT_CLIFF_VERSION not found in release.yml"; exit 1; }
          file="git-cliff-${version}-x86_64-unknown-linux-musl.tar.gz"
          grep -qF "$file" .github/release/tests/git-cliff.sha256 || { echo "::error::tests/git-cliff.sha256 has no entry for $file: update it with GIT_CLIFF_VERSION"; exit 1; }
          curl -fsSL -o "$RUNNER_TEMP/$file" "https://github.com/orhun/git-cliff/releases/download/v${version}/${file}"
          (cd "$RUNNER_TEMP" && sha256sum -c "$GITHUB_WORKSPACE/.github/release/tests/git-cliff.sha256")
          mkdir -p "$RUNNER_TEMP/git-cliff-bin"
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP/git-cliff-bin" --strip-components=1 "git-cliff-${version}/git-cliff"
          echo "$RUNNER_TEMP/git-cliff-bin" >>"$GITHUB_PATH"
          "$RUNNER_TEMP/git-cliff-bin/git-cliff" --version
      - name: shellcheck
        run: shellcheck --shell=bash -x --source-path=SCRIPTDIR .github/ci-setup.sh .github/release/*.sh .github/release/tests/*.sh .github/release/tests/stubs/*
      - name: tests
        run: .github/release/tests/run-all.sh

  # Web console (web/): lint + format, types, translations, tests, generated-code
  # drift and the production build. Needs nothing from the Rust jobs: the API client
  # is generated from the committed openapi.json, whose own drift test-sqlite checks.
  web:
    runs-on: ubuntu-latest
    # Exact tag, the same Node as the Nix devshell (flake.lock). Tag, not digest:
    # like the rust image above, a digest would also freeze out Debian security
    # rebuilds of this tag, and the tag already fixes Node itself.
    # Keep in step with NODE_VERSION (and its pinned tarball hashes) of the e2e job.
    container: node:24.21.0-bookworm
    env:
      # pnpm comes from web/package.json `packageManager` (version + sha512 of the
      # tarball, verified by corepack); no interactive download prompt in CI.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      # Corepack resolves `packageManager` from the working directory, so every pnpm
      # step runs inside web/.
      - name: pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          node --version
          pnpm --version
      # Same as `xtask dist`: dependency install scripts never run.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      # Fails on a key missing from a locale or {{placeholders}} that differ.
      - run: pnpm i18n:check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - name: generated API client matches openapi.json
        working-directory: web
        run: |
          pnpm gen:api
          git status --porcelain -- src/api/generated
          test -z "$(git status --porcelain -- src/api/generated)"
      - name: build (and the committed route tree is current)
        working-directory: web
        run: |
          pnpm build
          git diff --exit-code -- src/routeTree.gen.ts

  clippy:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABEL || 'selfhosted') || 'ubuntu-latest' }}
    container:
      image: rust:1.99.1-bookworm
      # The persistent cache of the self-hosted runner (see the header); empty elsewhere.
      volumes:
        - deskhaven-ci-registry:/usr/local/cargo/registry
        - deskhaven-ci-git:/usr/local/cargo/git
        - deskhaven-ci-target:/ci-target
    env:
      CARGO_TARGET_DIR: /ci-target/clippy
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: .github/ci-setup.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABEL || 'selfhosted') || 'ubuntu-latest' }}
    container:
      image: rust:1.99.1-bookworm
      # The persistent cache of the self-hosted runner (see the header); empty elsewhere.
      volumes:
        - deskhaven-ci-registry:/usr/local/cargo/registry
        - deskhaven-ci-git:/usr/local/cargo/git
        - deskhaven-ci-target:/ci-target
    env:
      CARGO_TARGET_DIR: /ci-target/deny
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: CI_SKIP_APT=1 .github/ci-setup.sh cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check

  # The test binaries are built once and run three times side by side: on SQLite
  # (DESKHAVEN_TEST_PG_URL unset, so PG-parameterised tests are skipped) and on PostgreSQL 16
  # and 17 (required: the DB test helper panics instead of skipping). Once built, concurrent
  # `cargo test` runs share the build directory without waiting for each other.
  test:
    runs-on: ${{ (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) && (vars.CI_RUNNER_LABEL || 'selfhosted') || 'ubuntu-latest' }}
    container:
      image: rust:1.99.1-bookworm
      # The persistent cache of the self-hosted runner (see the header); empty elsewhere.
      volumes:
        - deskhaven-ci-registry:/usr/local/cargo/registry
        - deskhaven-ci-git:/usr/local/cargo/git
        - deskhaven-ci-target:/ci-target
    services:
      pg16:
        image: postgres:16
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      pg17:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TARGET_DIR: /ci-target/test
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: .github/ci-setup.sh
      - name: build the tests
        run: cargo test --workspace --all-targets --no-run
      # Throwaway CI-only credentials for the service containers above.
      - name: tests (SQLite, PostgreSQL 16 and 17)
        run: |
          set -uo pipefail
          suite() {
            if [ -n "$2" ]; then
              export DESKHAVEN_TEST_PG_URL="$2" DESKHAVEN_TEST_REQUIRE_PG=1
            fi
            cargo test --workspace --all-targets --no-fail-fast >"$RUNNER_TEMP/test-$1.log" 2>&1
          }
          names=(sqlite pg16 pg17)
          urls=("" postgres://deskhaven:deskhaven@pg16:5432/deskhaven_test postgres://deskhaven:deskhaven@pg17:5432/deskhaven_test)
          pids=()
          for i in 0 1 2; do
            suite "${names[$i]}" "${urls[$i]}" &
            pids+=("$!")
          done
          status=0
          for i in 0 1 2; do
            name="${names[$i]}"
            if wait "${pids[$i]}"; then result=passed; else result=FAILED; status=1; fi
            echo "::group::$name: $result"
            cat "$RUNNER_TEMP/test-$name.log"
            echo "::endgroup::"
            grep -h '^test result' "$RUNNER_TEMP/test-$name.log" | grep -v ' 0 failed' | sed "s/^/$name: /" || true
          done
          exit "$status"
      # The committed admin API OpenAPI document must match the code (the console's
      # types are generated from it). Reuses the test build; only xtask itself links.
      - run: cargo xtask gen-openapi --check
      # The strategy option catalog must match the vendored client source and the overlay
      # (xtask/vendor/strategy-catalog, crates/deskhaven-core/src/strategies/catalog).
      - run: cargo xtask gen-strategy-catalog --check
      # The configuration reference (docs/reference/configuration.md) must match the
      # settings registry and the bootstrap schema.
      - run: cargo xtask docs --check

  e2e:
    runs-on: ubuntu-latest
    container: rust:1.99.1-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_e2e
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The same Node as the web job's image and the Nix devshell.
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q -f FETCH_HEAD
          git clean -ffdxq
      - run: .github/ci-setup.sh
      # The tarball must match the sha256 pinned here (from the release's SHASUMS256.txt);
      # bump both with NODE_VERSION.
      - name: node
        run: |
          case "$(dpkg --print-architecture)" in
            amd64) arch=x64 sha=6e1db87ef58b8819e5d5402eff1536491b18edd8eb7bee5ef7897876e88dc5ff ;;
            arm64) arch=arm64 sha=724282c3b43aec998aa9527380465b45d229e021b58035f5f4f63095eabfe5d5 ;;
            *) echo "unsupported architecture" >&2; exit 1 ;;
          esac
          tarball="node-v$NODE_VERSION-linux-$arch.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/$tarball"
          echo "$sha  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local --strip-components=1
          rm "$tarball"
          node --version
      - name: pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          pnpm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      # The console first: the binary embeds web/dist when it is built.
      - run: pnpm build
        working-directory: web
      - run: cargo build -p deskhaven
      # The Chromium build of the locked @playwright/test, plus its apt dependencies.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: e2e (SQLite)
        id: e2e-sqlite
        run: pnpm e2e
        working-directory: web
      # Also after a failed SQLite run, but not when the setup before it failed.
      - name: e2e (PostgreSQL)
        if: ${{ !cancelled() && steps.e2e-sqlite.conclusion != 'skipped' }}
        run: pnpm e2e
        working-directory: web
        env:
          # Throwaway CI-only credentials for the service container above.
          DESKHAVEN_E2E_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_e2e
      # Reports, traces and server logs of both runs (web/e2e-results/{sqlite,postgres}).
      - name: upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/e2e-results
          retention-days: 14
