# GitHub Actions CI for deskhaven.
#
# No JavaScript actions are used, except the e2e job's failure upload (that job installs
# node; the action is pinned by commit): the job image (rust:*-bookworm) has no node.
# Sources are fetched with plain git (the repository is public; a private repo would need
# a token passed to the checkout step). No caching until a prebuilt CI image exists (M4-06).
#
# Runner label: every job uses `runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}`.
# To use a self-hosted runner, set the repository variable CI_RUNNER_LABEL (Settings ->
# Secrets and variables -> Actions -> Variables). Jobs run inside the `container:` image,
# so the runner only needs Docker access.
#
# Pipeline: fmt -> clippy + deny -> test {sqlite, postgres-16, postgres-17} + coverage
# + e2e; the web console job runs in parallel with all of it.
# The container image tag (repeated per job) must match the channel in rust-toolchain.toml.
# Network egress needed: git host, crates.io, Debian mirrors, Docker Hub,
# github.com (cargo-deny fetches the RustSec advisory DB from GitHub),
# registry.npmjs.org (web, e2e), and for e2e nodejs.org, the Playwright browser CDN
# (cdn.playwright.dev and its mirrors).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The jobs only read: no job pushes, comments or publishes.
permissions:
  contents: read

env:
  # Tool versions, defined once.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Warnings are denied in exactly one place: clippy `-D warnings` (with --all-targets it
  # also covers test code). No global RUSTFLAGS, so `cargo install` of tools is unaffected.
  #
  # Checkout inputs: PRs fetch refs/pull/N/head, pushes fetch the commit (ref as fallback).
  CI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  CI_FETCH_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
  CI_FALLBACK_REF: ${{ github.ref }}

jobs:
  fmt:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      # Toolchain only (rustfmt); no apt packages needed.
      - run: CI_SKIP_APT=1 .github/ci-setup.sh
      - run: cargo fmt --all -- --check

  # Web console (web/): lint + format, types, translations, tests, generated-code
  # drift and the production build. Needs nothing from the Rust jobs: the API client
  # is generated from the committed openapi.json, whose own drift test-sqlite checks.
  web:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # Exact tag, the same Node as the Nix devshell (flake.lock). Tag, not digest:
    # like the rust image above, a digest would also freeze out Debian security
    # rebuilds of this tag, and the tag already fixes Node itself.
    # Keep in step with NODE_VERSION (and its pinned tarball hashes) of the e2e job.
    container: node:24.21.0-bookworm
    env:
      # pnpm comes from web/package.json `packageManager` (version + sha512 of the
      # tarball, verified by corepack); no interactive download prompt in CI.
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      # Corepack resolves `packageManager` from the working directory, so every pnpm
      # step runs inside web/.
      - name: pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          node --version
          pnpm --version
      # Same as `xtask dist`: dependency install scripts never run.
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm lint
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      # Fails on a key missing from a locale or {{placeholders}} that differ.
      - run: pnpm i18n:check
        working-directory: web
      - run: pnpm test
        working-directory: web
      - name: generated API client matches openapi.json
        working-directory: web
        run: |
          pnpm gen:api
          git status --porcelain -- src/api/generated
          test -z "$(git status --porcelain -- src/api/generated)"
      - name: build (and the committed route tree is current)
        working-directory: web
        run: |
          pnpm build
          git diff --exit-code -- src/routeTree.gen.ts

  clippy:
    needs: fmt
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .github/ci-setup.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    needs: fmt
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: CI_SKIP_APT=1 .github/ci-setup.sh cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check

  test-sqlite:
    needs: [clippy, deny]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .github/ci-setup.sh
      # DESKHAVEN_TEST_PG_URL is deliberately unset: PG-parameterised tests are skipped.
      - run: cargo test --workspace --all-targets --no-fail-fast
      # The committed admin API OpenAPI document must match the code (the console's
      # types are generated from it). Reuses the test build; only xtask itself links.
      - run: cargo xtask gen-openapi --check
      # The strategy option catalog must match the vendored client source and the overlay
      # (xtask/vendor/strategy-catalog, crates/deskhaven-core/src/strategies/catalog).
      - run: cargo xtask gen-strategy-catalog --check

  test-postgres:
    needs: [clippy, deny]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only credentials for the service container above.
      DESKHAVEN_TEST_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_test
      # The DB test helper panics (instead of skipping PG) if the URL is missing.
      DESKHAVEN_TEST_REQUIRE_PG: "1"
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .github/ci-setup.sh
      - run: cargo test --workspace --all-targets --no-fail-fast

  # Runs in parallel with the tests; report only.
  coverage:
    needs: [clippy, deny]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DESKHAVEN_TEST_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_test
      DESKHAVEN_TEST_REQUIRE_PG: "1"
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .github/ci-setup.sh cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      # Report only until the end of M2. To enforce the gate, append
      # `--fail-under-lines 80` to the command below.
      - run: cargo llvm-cov --workspace --all-targets --no-fail-fast --summary-only # --fail-under-lines 80

  # Console end-to-end flows (web/e2e, Playwright) against the real binary with the
  # embedded console, once on SQLite and once on the service's empty PostgreSQL database.
  # The Rust image gets the web job's Node (official tarball, sha256 pinned below) and
  # Playwright's Chromium with its system libraries.
  e2e:
    needs: [clippy, deny]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_e2e
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The same Node as the web job's image and the Nix devshell.
      NODE_VERSION: "24.21.0"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .github/ci-setup.sh
      # The tarball must match the sha256 pinned here (from the release's SHASUMS256.txt);
      # bump both with NODE_VERSION.
      - name: node
        run: |
          case "$(dpkg --print-architecture)" in
            amd64) arch=x64 sha=6e1db87ef58b8819e5d5402eff1536491b18edd8eb7bee5ef7897876e88dc5ff ;;
            arm64) arch=arm64 sha=724282c3b43aec998aa9527380465b45d229e021b58035f5f4f63095eabfe5d5 ;;
            *) echo "unsupported architecture" >&2; exit 1 ;;
          esac
          tarball="node-v$NODE_VERSION-linux-$arch.tar.gz"
          curl -fsSLO "https://nodejs.org/dist/v$NODE_VERSION/$tarball"
          echo "$sha  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C /usr/local --strip-components=1
          rm "$tarball"
          node --version
      - name: pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          pnpm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      # The console first: the binary embeds web/dist when it is built.
      - run: pnpm build
        working-directory: web
      - run: cargo build -p deskhaven
      # The Chromium build of the locked @playwright/test, plus its apt dependencies.
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - name: e2e (SQLite)
        id: e2e-sqlite
        run: pnpm e2e
        working-directory: web
      # Also after a failed SQLite run, but not when the setup before it failed.
      - name: e2e (PostgreSQL)
        if: ${{ !cancelled() && steps.e2e-sqlite.conclusion != 'skipped' }}
        run: pnpm e2e
        working-directory: web
        env:
          # Throwaway CI-only credentials for the service container above.
          DESKHAVEN_E2E_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_e2e
      # Reports, traces and server logs of both runs (web/e2e-results/{sqlite,postgres}).
      - name: upload Playwright results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: web/e2e-results
          retention-days: 14
