# Release pipeline for deskhaven (M4-06).
#
# OPERATING RULE: push ONE release tag at a time and wait for its run to finish. Runs that
# publish share one concurrency group and GitHub keeps only one pending run per group, so
# a second tag pushed while one run is going and a third tag pushed after it would drop the
# second run. GitHub also does not start workflows at all when more than 3 tags are
# pushed at once. A tag whose run was dropped is re-released by deleting and re-pushing it.
#
# Triggers
#   push of a `v*` tag     builds, verifies and PUBLISHES: images to ghcr.io, a GitHub Release
#   workflow_dispatch      NEVER publishes, whatever ref it runs on: builds and verifies
#                          everything, pushes no image, tags nothing and creates no release;
#                          the release files and notes are kept as the `release-preview`
#                          artifact
#
# Publishing is refused (.github/release/meta.sh, preflight) unless the tag is
# `vX.Y.Z[-prerelease]`, equals the workspace version in Cargo.toml, deploy/compose/.env.example
# pins that version (DESKHAVEN_TAG), the commit is on main and has a successful push ci run
# there, and neither a release (draft included) nor the images for this version exist yet:
# nothing already published is ever replaced.
#
# Publish order (each step only starts when the previous one succeeded)
#   preflight           no release or draft for the tag exists (before anything is pushed)
#   image-push          per-arch images by digest, nothing tagged
#   manifest            the exact tag X.Y.Z for BOTH images
#   release             draft with all assets, then published
#   promote             moves X.Y and latest, from the releases that are PUBLISHED at that moment
# A failure anywhere stops the later steps. A failure after `release` leaves a published
# release and exact image tags; only promote needs re-running (re-run that job alone: it is
# idempotent and decides again from the current releases).
#
# Job graph
#   meta ─┬─ web ─┬─ csp (built-dist CSP checks, hard-fail)
#   preflight     └─ notices-sbom (notices of deskhaven and hbbr, Rust SBOM)
#         ├─ changelog (git-cliff)
#         └─ image-build x4 {deskhaven, relay} x {amd64, arm64}   needs web, csp, notices-sbom
#              │   build natively, cargo audit bin, tarball, image as an OCI archive
#              └─ image-push x4   (needs preflight) smoke tests, then push THAT archive by digest
#                   └─ manifest -> release -> promote
#
# What is audited
#   deskhaven   `cargo audit bin` BLOCKS on any vulnerability, unmaintained, unsound or
#               yanked finding that deny.toml does not ignore
#   relay (hbbr) `cargo audit bin` is REPORTED only (job summary + release asset): upstream
#               hbbr's lockfile has advisories we cannot fix without modifying upstream
#
# Trust boundaries: third-party code (cargo-installed tools, base images, the build itself)
# runs only in jobs WITHOUT `packages: write` or `contents: write`. image-build builds and
# audits and uploads artifacts. image-push, which holds the registry token only after its
# smoke tests, does not install or build anything: it pushes the archive image-build
# produced (a `FROM` an OCI layout, so the pushed manifest is byte-identical to the built
# one, which is asserted) and checks that the pushed binaries equal the audited ones, never
# running a container while logged in. preflight has `contents: write` and runs no
# repository code at all. The token is passed to docker login and gh steps only.
#
# Conventions as in ci.yml: sources come from plain git, no third-party JavaScript actions.
# The exceptions are GitHub's own artifact actions, pinned by commit (upload-artifact is the
# one ci.yml uses on failure). Tools are installed with `cargo install --locked` at pinned
# versions through .github/ci-setup.sh; tool versions marked `renovate:` are bumped by
# Renovate (renovate.json). No caching until a prebuilt CI image exists.
#
# Runners: GitHub-hosted only. amd64 images build on ubuntu-latest and arm64 images on the
# native ubuntu-24.04-arm (free for public repositories), so nothing runs under QEMU.
# CI_RUNNER_LABEL does not apply here. Network egress needed: everything ci.yml needs, plus
# ghcr.io, Docker Hub (base images, moby/buildkit) and gcr.io (distroless).

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# All publishing runs share one group, in order; dry runs do not wait for each other.
concurrency:
  group: release-${{ github.event_name == 'push' && 'publish' || github.run_id }}
  cancel-in-progress: false

# Jobs add only what they need: packages: read (meta), contents: write (preflight, release),
# packages: write (image-push, manifest, promote).
permissions:
  contents: read

env:
  # Tool versions, defined once. (cargo-auditable is pinned in the Dockerfiles.)
  # renovate: datasource=crate depName=cargo-audit
  CARGO_AUDIT_VERSION: "0.22.2"
  # renovate: datasource=crate depName=cargo-cyclonedx
  CARGO_CYCLONEDX_VERSION: "0.5.9"
  # renovate: datasource=crate depName=cargo-about
  CARGO_ABOUT_VERSION: "0.9.3"
  # renovate: datasource=crate depName=git-cliff
  GIT_CLIFF_VERSION: "2.14.2"
  # The BuildKit that buildx runs in a container (docker-container driver: needed for
  # push-by-digest and OCI export), pinned by digest.
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_VERSION: "v0.34.0"
  BUILDKIT_DIGEST: "sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

jobs:
  # Decides what this run is (version, whether it publishes) and refuses runs that must not
  # publish. The logic is .github/release/meta.sh.
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the ci run of the tagged commit
      packages: read # does an image with this version exist
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      # The commit and main: ancestry needs main's history.
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q "$CI_REPO_URL" "$GITHUB_SHA" '+refs/heads/main:refs/remotes/origin/main'
          git checkout -q "$GITHUB_SHA"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: version, mode and refusals
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/release/meta.sh
      # A release must not ship a commit whose tests never passed ON MAIN.
      - name: ci passed on main for this commit
        if: steps.v.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 --json event,headBranch,conclusion \
            --jq '[.[] | select(.event == "push" and .headBranch == "main" and .conclusion == "success")] | length')"
          [ "$count" -ge 1 ] || { echo "::error::no successful push ci run on main for $GITHUB_SHA"; exit 1; }

  # No release, draft included, may exist for the tag: checked BEFORE anything is pushed.
  # `contents: write` is what makes gh list drafts, so this job runs no repository code at
  # all (no checkout, only gh against an explicit repository). An API failure of any kind
  # (404 for the repository included) fails the job; only a readable list without the tag
  # counts as "free".
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: no release or draft for this tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          releases="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | .tag_name')"
          if grep -qxF "$GITHUB_REF_NAME" <<<"$releases"; then
            echo "::error::a release or draft for $GITHUB_REF_NAME already exists; a release is never replaced (delete it, or tag a new version)"
            exit 1
          fi
          echo "no release or draft for $GITHUB_REF_NAME"

  # The console, built once. Its dist is shared with csp (checks) and image-build (consistency).
  web:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: node:24.21.0-bookworm # as the web job in ci.yml
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: pnpm
        working-directory: web
        run: |
          corepack enable pnpm
          node --version
          pnpm --version
      - run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: web
      - run: pnpm build
        working-directory: web
      # `pnpm sbom` ships with pnpm (pinned by packageManager in web/package.json): no extra
      # tool to install or pin, it reads the lockfile, and it knows pnpm's layout, which the
      # npm-based CycloneDX tool does not. Production dependencies only: what ships in dist.
      - name: SBOM and license notice of the production dependencies
        working-directory: web
        run: |
          mkdir -p ../out
          pnpm sbom --lockfile-only --prod --sbom-format cyclonedx --sbom-type application --out "../out/deskhaven-web-v${VERSION}.cdx.json"
          pnpm licenses list --prod --json --long >/tmp/licenses.json
          node ../.github/release/web-licenses.mjs </tmp/licenses.json >../out/web-licenses.txt
      - name: upload dist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7
      - name: upload web notice
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-licenses
          path: out/web-licenses.txt
          if-no-files-found: error
          retention-days: 7
      - name: upload web SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel-sbom-web
          path: out/deskhaven-web-v*.cdx.json
          if-no-files-found: error
          retention-days: 7

  # The two deskhaven-web checks that normal CI skips (it builds no web/dist for its Rust
  # jobs), run against the built dist. DESKHAVEN_TEST_REQUIRE_WEB_DIST=1 turns "dist not
  # built" from a skip into a failure, so they cannot pass vacuously.
  csp:
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist
      - run: CI_SKIP_APT=1 .github/ci-setup.sh
      - name: built dist is CSP clean
        env:
          DESKHAVEN_TEST_REQUIRE_WEB_DIST: "1"
        run: |
          set -euo pipefail
          cargo test -p deskhaven-web --test csp -- the_built | tee csp.log
          # Exactly the two built-dist tests ran (a renamed test would run none and "pass").
          grep -q "test result: ok. 2 passed" csp.log

  # Third-party license notices (cargo-about + SecLists + native libraries + the console's
  # npm packages for deskhaven; cargo-about over the pinned upstream lockfile for hbbr)
  # and the Rust SBOM.
  #
  # The SBOM comes from `cargo cyclonedx` for the shipping binary (crates/deskhaven): it
  # resolves the whole workspace graph for the musl release target, normal dependencies only,
  # which is exactly what is linked. The other workspace members are libraries inside that
  # graph or dev tooling (xtask) that ships nowhere.
  notices-sbom:
    needs: [meta, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: download web notice
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-licenses
          path: web-licenses
      - run: >-
          CI_SKIP_APT=1 .github/ci-setup.sh
          cargo-about@${{ env.CARGO_ABOUT_VERSION }}/cli
          cargo-cyclonedx@${{ env.CARGO_CYCLONEDX_VERSION }}
      - name: third-party notices
        run: |
          mkdir -p out
          .github/release/notices.sh out/THIRD-PARTY-NOTICES.txt web-licenses/web-licenses.txt
          .github/release/notices-relay.sh out/THIRD-PARTY-NOTICES-relay.txt
      - name: Rust SBOM
        run: |
          cargo cyclonedx --manifest-path crates/deskhaven/Cargo.toml --format json --spec-version 1.5 \
            --describe binaries --target x86_64-unknown-linux-musl --no-build-deps
          mv crates/deskhaven/deskhaven_bin.cdx.json "out/deskhaven-v${VERSION}.cdx.json"
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel-supply-chain
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Release notes from the conventional commits between the previous release and this one
  # (tags.sh prev: semver order, so an old-line patch gets its own line's previous tag, and
  # a final release skips its release candidates). Commit subjects are rendered inside code
  # spans by cliff.toml.
  changelog:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      # Full history and all tags: the range is "previous tag .. this commit".
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q "$CI_REPO_URL" "$GITHUB_SHA" '+refs/tags/*:refs/tags/*'
          git checkout -q "$GITHUB_SHA"
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - run: CI_SKIP_APT=1 .github/ci-setup.sh git-cliff@${{ env.GIT_CLIFF_VERSION }}
      - name: release notes
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          prev="$(.github/release/tags.sh prev "$tag")"
          echo "notes for $tag: ${prev:-the beginning}..$GITHUB_SHA"
          git-cliff --config .github/release/cliff.toml "${prev:+$prev..}$GITHUB_SHA" --tag "$tag" --strip all --output release-notes.md
          # Only tests, ci and chores in the range: a heading alone would look broken.
          if ! grep -q '^- ' release-notes.md; then
            printf '\nNo user-facing changes.\n' >>release-notes.md
          fi
          test -s release-notes.md
          cat release-notes.md
      - name: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 7

  # One job per image and architecture, each on a native runner. No registry or release
  # token here (only `contents: read`), because this is where third-party code runs.
  #   1. the binary alone (Dockerfile target `binary`) is audited with `cargo audit bin`
  #      and, for deskhaven, packed as the release tarball;
  #   2. the image is exported as an OCI archive, built by the same cached stages, so its
  #      binaries are the very files audited in step 1. It carries the label
  #      org.opencontainers.image.revision (this commit).
  # Both are uploaded for image-push. No provenance or SBOM attestations on the per-arch
  # images: they would turn each per-arch digest into an index and the multi-arch manifest
  # into an index of indexes. The dependency data of the binaries is embedded by cargo
  # auditable instead.
  image-build:
    needs: [meta, web, csp, notices-sbom]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: deskhaven, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, target: x86_64-unknown-linux-musl, audit_mode: enforce }
          - { image: deskhaven, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, target: aarch64-unknown-linux-musl, audit_mode: enforce }
          - { image: relay, arch: amd64, runner: ubuntu-latest, platform: linux/amd64, target: x86_64-unknown-linux-musl, audit_mode: report }
          - { image: relay, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64, target: aarch64-unknown-linux-musl, audit_mode: report }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
      AUDIT_MODE: ${{ matrix.audit_mode }}
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: download dist
        if: matrix.image == 'deskhaven'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: checked-dist
      - name: download notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-supply-chain
          path: supply-chain
      - name: dockerfile, notices and builder
        run: |
          set -euo pipefail
          if [ "$IMAGE" = deskhaven ]; then
            echo "DOCKERFILE=deploy/docker/deskhaven.Dockerfile" >>"$GITHUB_ENV"
            notice=THIRD-PARTY-NOTICES.txt
          else
            echo "DOCKERFILE=deploy/docker/relay.Dockerfile" >>"$GITHUB_ENV"
            notice=THIRD-PARTY-NOTICES-relay.txt
          fi
          # The `notices` stage of the Dockerfile is replaced by a directory holding just the notice.
          mkdir -p notices
          cp "supply-chain/${notice}" notices/THIRD-PARTY-NOTICES.txt
          # The docker-container driver is what supports OCI export and push-by-digest.
          docker buildx create --name release --driver docker-container --driver-opt "image=moby/buildkit:${BUILDKIT_VERSION}@${BUILDKIT_DIGEST}" --use
          docker buildx inspect --bootstrap
      - run: CI_SKIP_APT=1 .github/ci-setup.sh cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      # VERSION is a build arg of the deskhaven Dockerfile only (the relay one has none).
      - name: build the binaries alone
        run: |
          set -euo pipefail
          args=()
          if [ "$IMAGE" = deskhaven ]; then args+=(--build-arg "VERSION=${VERSION}"); fi
          docker buildx build --builder release --platform "$PLATFORM" --file "$DOCKERFILE" \
            "${args[@]}" --target binary --output type=local,dest=binary .
          ls -l binary

      - name: the shipped console is the checked console
        if: matrix.image == 'deskhaven'
        run: |
          docker buildx build --builder release --platform "$PLATFORM" --file "$DOCKERFILE" \
            --target web-dist --output type=local,dest=image-dist .
          diff -r image-dist checked-dist
          echo "web/dist of the image is identical to the dist the CSP checks ran on"

      - name: cargo audit bin
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "$IMAGE" = deskhaven ]; then
            .github/release/audit-bin.sh "$AUDIT_MODE" binary/deskhaven "out/audit-deskhaven-v${VERSION}-${TARGET}.txt" "deskhaven ${ARCH}"
          else
            .github/release/audit-bin.sh "$AUDIT_MODE" binary/hbbr "out/audit-hbbr-v${VERSION}-${TARGET}.txt" "hbbr (relay) ${ARCH}"
          fi

      - name: release tarball
        if: matrix.image == 'deskhaven'
        run: |
          set -euo pipefail
          name="deskhaven-v${VERSION}-${TARGET}"
          mkdir -p "pack/${name}"
          install -m 0755 binary/deskhaven "pack/${name}/deskhaven"
          install -m 0644 LICENSE "pack/${name}/LICENSE"
          install -m 0644 notices/THIRD-PARTY-NOTICES.txt "pack/${name}/THIRD-PARTY-NOTICES.txt"
          # Reproducible archive: sorted, no owners, commit time as mtime, no gzip name/time.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -C pack -cf - "$name" | gzip -n >"out/${name}.tar.gz"
          ls -l out

      - name: the image, as an OCI archive
        run: |
          set -euo pipefail
          args=(--builder release --platform "$PLATFORM" --file "$DOCKERFILE" --provenance=false --sbom=false
                --build-context notices=notices --label "org.opencontainers.image.revision=${GITHUB_SHA}")
          if [ "$IMAGE" = deskhaven ]; then args+=(--build-arg "VERSION=${VERSION}"); fi
          docker buildx build "${args[@]}" --output type=oci,dest=image.tar .

      - name: upload the image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oci-${{ matrix.image }}-${{ matrix.arch }}
          path: image.tar
          if-no-files-found: error
          retention-days: 7
      - name: upload the audited binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.image }}-${{ matrix.arch }}
          path: binary/
          if-no-files-found: error
          retention-days: 7
      - name: upload tarball and audit reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel-${{ matrix.image }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error
          retention-days: 7

  # Smoke-tests the archive image-build produced, THEN pushes it by digest only (no tag yet;
  # the manifest job tags it). Holds the registry token only after the smoke tests, and runs
  # no repository code (no checkout, no tool installs, only docker):
  #   1. extract the archive (entries other than files and directories are refused), load
  #      it into the local docker, run the smoke tests and compare its binaries with the
  #      audited ones. NO registry credentials exist yet.
  #   2. only when publishing: log in, push, check the digest and the files again from the
  #      pulled image WITHOUT running it, log out.
  # A dry run stops after step 1. preflight (no release or draft for the tag) must have passed.
  image-push:
    needs: [meta, preflight, image-build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: deskhaven, arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { image: deskhaven, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
          - { image: relay, arch: amd64, runner: ubuntu-latest, platform: linux/amd64 }
          - { image: relay, arch: arm64, runner: ubuntu-24.04-arm, platform: linux/arm64 }
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      IMAGE: ${{ matrix.image }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: ${{ matrix.platform }}
    steps:
      - name: download the image archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oci-${{ matrix.image }}-${{ matrix.arch }}
          path: oci
      - name: download the audited binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin-${{ matrix.image }}-${{ matrix.arch }}
          path: audited
      - name: download notices
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-supply-chain
          path: supply-chain
      - name: builder and archive
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "$IMAGE" = deskhaven ]; then
            echo "IMAGE_NAME=ghcr.io/${owner}/deskhaven" >>"$GITHUB_ENV"
          else
            echo "IMAGE_NAME=ghcr.io/${owner}/deskhaven-relay" >>"$GITHUB_ENV"
          fi
          docker buildx create --name release --driver docker-container --driver-opt "image=moby/buildkit:${BUILDKIT_VERSION}@${BUILDKIT_DIGEST}" --use
          docker buildx inspect --bootstrap
          # The archive comes from another job: only regular files and directories, no
          # absolute or parent-relative paths, before it is extracted.
          tar -tvf oci/image.tar >listing.txt
          if awk '{ t = substr($1, 1, 1); if (t != "-" && t != "d") bad = 1 } END { exit bad }' listing.txt; then :; else
            echo "::error::the image archive contains entries that are not regular files or directories"; exit 1
          fi
          if tar -tf oci/image.tar | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::the image archive contains absolute or parent-relative paths"; exit 1
          fi
          mkdir image-oci empty
          tar -xf oci/image.tar -C image-oci --no-same-owner
          jq -e '.manifests | length == 1' image-oci/index.json >/dev/null
          printf 'FROM image\n' >push.Dockerfile
      - name: load the archive into the local docker
        run: |
          docker buildx build --builder release --platform "$PLATFORM" --file push.Dockerfile --provenance=false --sbom=false \
            --build-context "image=oci-layout://${PWD}/image-oci" --load --tag "release-smoke/${IMAGE}:${ARCH}" empty
          echo "LOCAL_REF=release-smoke/${IMAGE}:${ARCH}" >>"$GITHUB_ENV"

      # The audited files are the shipped files. (deskhaven embeds the console, so this
      # covers the dist as well.) Copying out of a created container runs nothing.
      - name: the image contains the audited binaries
        env:
          REF: ${{ env.LOCAL_REF }}
        run: |
          set -euo pipefail
          id="$(docker create "$REF")"
          if [ "$IMAGE" = deskhaven ]; then
            docker cp "${id}:/usr/local/bin/deskhaven" shipped-deskhaven
            cmp shipped-deskhaven audited/deskhaven
            docker cp "${id}:/usr/share/licenses/deskhaven/THIRD-PARTY-NOTICES.txt" shipped-notice.txt
            cmp shipped-notice.txt supply-chain/THIRD-PARTY-NOTICES.txt
          else
            docker cp "${id}:/usr/local/bin/hbbr" shipped-hbbr
            docker cp "${id}:/usr/local/bin/relay-key-guard" shipped-guard
            cmp shipped-hbbr audited/hbbr
            cmp shipped-guard audited/relay-key-guard
            docker cp "${id}:/usr/share/licenses/rustdesk-server/THIRD-PARTY-NOTICES.txt" shipped-notice.txt
            cmp shipped-notice.txt supply-chain/THIRD-PARTY-NOTICES-relay.txt
          fi
          docker rm "$id" >/dev/null
          echo "shipped files are byte-identical to the audited ones"

      - name: smoke test (no registry credentials present)
        env:
          REF: ${{ env.LOCAL_REF }}
        run: |
          set -euo pipefail
          user="$(docker image inspect "$REF" --format '{{.Config.User}}')"
          [ "$user" = "65532:65532" ] || { echo "::error::image runs as '$user', not 65532:65532"; exit 1; }
          revision="$(docker image inspect "$REF" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "$revision" = "$GITHUB_SHA" ] || { echo "::error::image revision label is '$revision', not $GITHUB_SHA"; exit 1; }
          if [ "$IMAGE" = deskhaven ]; then
            reported="$(timeout 30 docker run --rm --read-only "$REF" --version)"
            echo "$reported"
            [ "$reported" = "deskhaven ${VERSION}" ] || { echo "::error::the image reports '$reported'"; exit 1; }
          else
            timeout 30 docker run --rm --read-only --entrypoint /usr/local/bin/hbbr "$REF" --version
            # The key guard must refuse to start without KEY (fail closed), not start hbbr.
            if timeout 30 docker run --rm --read-only "$REF" 2>guard.err; then
              echo "::error::the relay started without KEY"; exit 1
            fi
            grep -q "KEY is not set" guard.err
          fi

      # From here on credentials exist: only push, pull, create/cp, comparisons. No docker run.
      - name: registry login
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - name: push by digest and verify
        if: env.PUBLISH == 'true'
        run: |
          set -euo pipefail
          built="$(jq -r '.manifests[0].digest' image-oci/index.json)"
          docker buildx build --builder release --platform "$PLATFORM" --file push.Dockerfile --provenance=false --sbom=false \
            --build-context "image=oci-layout://${PWD}/image-oci" \
            --output "type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" \
            --metadata-file metadata.json empty
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::no valid image digest in the build metadata"; exit 1; }
          # The registry holds exactly the manifest image-build produced.
          [ "$digest" = "$built" ] || { echo "::error::pushed manifest $digest differs from the built $built"; exit 1; }
          docker pull "${IMAGE_NAME}@${digest}"
          id="$(docker create "${IMAGE_NAME}@${digest}")"
          if [ "$IMAGE" = deskhaven ]; then
            docker cp "${id}:/usr/local/bin/deskhaven" pulled-deskhaven
            cmp pulled-deskhaven audited/deskhaven
          else
            docker cp "${id}:/usr/local/bin/hbbr" pulled-hbbr
            docker cp "${id}:/usr/local/bin/relay-key-guard" pulled-guard
            cmp pulled-hbbr audited/hbbr
            cmp pulled-guard audited/relay-key-guard
          fi
          docker rm "$id" >/dev/null
          mkdir -p digests
          echo "$digest" >"digests/${IMAGE}-${ARCH}.txt"
          echo "pushed ${IMAGE_NAME}@${digest}; the pulled files equal the audited ones"
      - name: registry logout
        if: always() && env.PUBLISH == 'true'
        run: docker logout ghcr.io
      - name: upload digest
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.image }}-${{ matrix.arch }}
          path: digests/
          if-no-files-found: error
          retention-days: 7

  # Joins the per-arch images into one multi-arch manifest per image and creates the EXACT
  # tag X.Y.Z (no leading v: the Docker convention; git tags keep it) for BOTH images. The
  # moving tags (X.Y, latest) are not touched here: promote does that after the release is
  # published. Both images share the version tag (one DESKHAVEN_TAG in compose pins both).
  # Every per-arch image must carry this commit as its revision label before an index is
  # created. A dry run only prints the plan.
  manifest:
    needs: [meta, image-push]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: download digest, deskhaven amd64
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-deskhaven-amd64
          path: digests
      - name: download digest, deskhaven arm64
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-deskhaven-arm64
          path: digests
      - name: download digest, relay amd64
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-relay-amd64
          path: digests
      - name: download digest, relay arm64
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digest-relay-arm64
          path: digests
      - name: registry login
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - name: exact tags
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != true ]; then
            echo "dry run: would create the exact tag ${VERSION} for both images, nothing is pushed"
            exit 0
          fi
          # shellcheck source=/dev/null
          . .github/release/registry-lib.sh
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          mkdir -p out
          : >out/images.txt
          # matrix name (as in the digest files) -> repository name
          pairs=(deskhaven:deskhaven relay:deskhaven-relay)
          declare -A sources
          # Everything is validated before any index is created.
          for pair in "${pairs[@]}"; do
            name="ghcr.io/${owner}/${pair#*:}"
            list=()
            for arch in amd64 arm64; do
              digest="$(cat "digests/${pair%%:*}-${arch}.txt")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::invalid digest for ${pair%%:*} ${arch}: '$digest'"; exit 1; }
              [ "$(revision_of "${name}@${digest}")" = "$GITHUB_SHA" ] ||
                { echo "::error::${name}@${digest} does not carry revision $GITHUB_SHA"; exit 1; }
              list+=("${name}@${digest}")
            done
            sources[$pair]="${list[*]}"
          done
          for pair in "${pairs[@]}"; do
            name="ghcr.io/${owner}/${pair#*:}"
            read -r -a list <<<"${sources[$pair]}"
            docker buildx imagetools create --tag "${name}:${VERSION}" "${list[@]}"
            echo "${name}@$(digest_of "${name}:${VERSION}")  (tag ${VERSION})" >>out/images.txt
          done
          cat out/images.txt
      - name: registry logout
        if: always() && env.PUBLISH == 'true'
        run: docker logout ghcr.io
      - name: upload image list
        if: env.PUBLISH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rel-images
          path: out/images.txt
          if-no-files-found: error
          retention-days: 7

  # SHA256SUMS over every release file (the set must equal the expected list), then the
  # GitHub Release: a draft with all files, then published. Runs after the images carry
  # their exact tag and BEFORE the moving tags move.
  release:
    needs: [meta, preflight, web, csp, notices-sbom, changelog, image-build, image-push, manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
      PRERELEASE: ${{ needs.meta.outputs.prerelease }}
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: download SBOM of the console
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-sbom-web
          path: assets
      - name: download notices and Rust SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-supply-chain
          path: assets
      - name: download tarball and audit, deskhaven amd64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-deskhaven-amd64
          path: assets
      - name: download tarball and audit, deskhaven arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-deskhaven-arm64
          path: assets
      - name: download audit, relay amd64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-relay-amd64
          path: assets
      - name: download audit, relay arm64
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-relay-arm64
          path: assets
      - name: download image list
        if: env.PUBLISH == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rel-images
          path: assets
      - name: download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - name: the assets are exactly the expected ones
        run: |
          set -euo pipefail
          expected=(
            "THIRD-PARTY-NOTICES.txt" "THIRD-PARTY-NOTICES-relay.txt"
            "deskhaven-v${VERSION}.cdx.json" "deskhaven-web-v${VERSION}.cdx.json"
          )
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl; do
            expected+=("deskhaven-v${VERSION}-${target}.tar.gz"
                       "audit-deskhaven-v${VERSION}-${target}.txt"
                       "audit-hbbr-v${VERSION}-${target}.txt")
          done
          if [ "$PUBLISH" = true ]; then expected+=("images.txt"); fi
          diff <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort) <(cd assets && find . -mindepth 1 -printf '%P\n' | LC_ALL=C sort)
          echo "asset set matches (${#expected[@]} files)"
      - name: SHA256SUMS and notes
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          # Written outside assets/ first: the listing must not include the file being written.
          (cd assets && find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort | xargs sha256sum) >SHA256SUMS
          mv SHA256SUMS assets/SHA256SUMS
          cat assets/SHA256SUMS
          {
            cat notes/release-notes.md
            echo
            echo "## Install"
            echo
            echo "- Binaries: \`deskhaven-v${VERSION}-<target>.tar.gz\` (static musl, x86_64 and aarch64). Verify with \`sha256sum -c SHA256SUMS --ignore-missing\`."
            echo "- Images: \`ghcr.io/${owner}/deskhaven:${VERSION}\` and \`ghcr.io/${owner}/deskhaven-relay:${VERSION}\` (amd64, arm64); digests in \`images.txt\`."
            echo "- \`THIRD-PARTY-NOTICES.txt\` (deskhaven), \`THIRD-PARTY-NOTICES-relay.txt\` (hbbr), the CycloneDX SBOMs and the \`cargo audit\` reports are attached."
          } >release-body.md
      - name: preview (dry run)
        if: env.PUBLISH != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l assets
          cat release-body.md
          # What the real run would decide for the GitHub "Latest" badge.
          .github/release/promote.sh decide
          mkdir -p preview
          cp -r assets preview/assets
          cp release-body.md preview/
      - name: upload preview (dry run)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-preview
          path: preview/
          if-no-files-found: error
          retention-days: 7
      - name: create and publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The tag still points at the commit that was built (annotated tags: the peeled
          # commit, which is the last line ls-remote prints for the two refs).
          remote="$(git ls-remote "$CI_REPO_URL" "refs/tags/${GITHUB_REF_NAME}" "refs/tags/${GITHUB_REF_NAME}^{}" | awk 'END { print $1 }')"
          [ "$remote" = "$GITHUB_SHA" ] || { echo "::error::tag $GITHUB_REF_NAME points to '$remote', not the built $GITHUB_SHA"; exit 1; }
          # What the "Latest" badge should be, from the releases published right now.
          latest="$(.github/release/promote.sh decide | sed -n 's/^latest=//p')"
          create_flags=()
          if [ "$PRERELEASE" = true ]; then create_flags+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "$GITHUB_REF_NAME" --notes-file release-body.md "${create_flags[@]}" assets/*
          # Publishing is the call that carries --latest.
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false "--latest=${latest}"

  # Moves X.Y and latest for BOTH images as one step, last, after the release is published,
  # deciding from the releases published at that moment (never from git tags or earlier
  # jobs): a newer release published meanwhile, a patch for an old line, a prerelease or
  # a re-run all come out right. Idempotent: if this job fails, re-run it alone.
  promote:
    needs: [meta, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      PUBLISH: ${{ needs.meta.outputs.publish }}
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]
      - name: registry login
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
      - name: move the tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PUBLISH" = true ]; then
            .github/release/promote.sh apply
          else
            echo "dry run: nothing is moved; the decision would be:"
            .github/release/promote.sh decide
          fi
      - name: registry logout
        if: always() && env.PUBLISH == 'true'
        run: docker logout ghcr.io
