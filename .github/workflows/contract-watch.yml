name: contract-watch

on:
  schedule:
    # Off the hour: schedules on the hour are delayed under load.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      base_commit:
        description: "Full client commit sha to compare against (default: tests/contract/UPSTREAM_COMMIT)"
        required: false
        type: string
      dry_run:
        description: "Print the issue body instead of opening an issue"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Two overlapping runs could both pass the duplicate check.
concurrency:
  group: contract-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      CI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
    steps:
      - name: checkout
        run: |
          git config --global --add safe.directory "$PWD"
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_SHA" || git fetch -q --depth=1 "$CI_REPO_URL" "$GITHUB_REF"
          git checkout -q FETCH_HEAD
      - name: watch upstream contract
        env:
          # Inputs go through env, never into the script text (no expression injection).
          BASE_COMMIT: ${{ inputs.base_commit }}
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$BASE_COMMIT" ]; then args+=(--base "$BASE_COMMIT"); fi
          scripts/contract-watch.sh "${args[@]}"
