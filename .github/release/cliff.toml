# Subjects are contributor text on a rendered page, so each renders inside a code span whose
# fence is longer than any backtick run in it: nothing in a subject can end the span early.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
{% set text = commit.message %}\
{% if commit.scope %}{% set text = commit.scope ~ ": " ~ commit.message %}{% endif %}\
{% set fence = text | split(pat="`") | length %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% for i in range(end=fence) %}`{% endfor %} {{ text }} {% for i in range(end=fence) %}`{% endfor %} \
({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# A subject that is not a conventional commit is left out rather than failing the release.
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
# Matches nothing: the workflow names the whole range with --tag, so release candidates and
# unpublished tags inside it do not split the notes.
tag_pattern = "^$"
topo_order = false

# Release notes are for users: tests, CI plumbing and chores stay in the git history.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^(test|ci|chore|build|style)", skip = true },
]
