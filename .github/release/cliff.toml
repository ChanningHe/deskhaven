# git-cliff configuration: release notes from conventional commits between two tags.
# Used by the release workflow:
#   git-cliff --config .github/release/cliff.toml [PREV..]SHA --tag vX.Y.Z --strip all
# Commit subjects look like `type(scope): subject (M4-06)`; the trailing task ID stays in the
# subject, it is what links a line to the task list.
#
# Commit subjects are text from contributors that ends up in a rendered release page, so
# every subject is rendered INSIDE A CODE SPAN (scope included): @mentions do not notify,
# links, images, HTML and autolinks do not render, backslashes stay literal. The fence is
# one backtick longer than the number of backticks in the subject (an upper bound of the
# longest run), padded with a space on both sides, so nothing in the subject can end the
# span early.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
{% set text = commit.message %}\
{% if commit.scope %}{% set text = commit.scope ~ ": " ~ commit.message %}{% endif %}\
{% set fence = text | split(pat="`") | length %}
- {% if commit.breaking %}**BREAKING** {% endif %}\
{% for i in range(end=fence) %}`{% endfor %} {{ text }} {% for i in range(end=fence) %}`{% endfor %} \
({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
# A subject that is not a conventional commit is left out rather than failing the release.
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
tag_pattern = "^v[0-9]"
topo_order = false

# Release notes are for users: tests, CI plumbing and chores stay in the git history.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^(test|ci|chore|build|style)", skip = true },
]
