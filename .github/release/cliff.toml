# git-cliff configuration: release notes from conventional commits since the previous tag.
# Used by the release workflow:
#   git-cliff --config .github/release/cliff.toml --latest --tag-pattern '^v' [--tag vX.Y.Z]
# Commit subjects look like `type(scope): subject (M4-06)`; the trailing task ID stays in the
# subject, it is what links a line to the task list.

[changelog]
header = ""
body = """
{% if version %}\
## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
  {% if commit.breaking %}**BREAKING** {% endif %}\
  {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true
# Commit subjects are text from contributors that ends up in a rendered release page:
# neutralise what could notify people (@mentions), link, embed an image or inject HTML.
postprocessors = [
    { pattern = '([\[\]<!])', replace = '\$1' },
    { pattern = '(^|[^\w`@])@([A-Za-z0-9][A-Za-z0-9_-]*(/[A-Za-z0-9._-]+)?)', replace = '$1`@$2`' },
]

[git]
conventional_commits = true
# A subject that is not a conventional commit is left out rather than failing the release.
filter_unconventional = true
protect_breaking_commits = true
sort_commits = "oldest"
tag_pattern = "^v[0-9]"
topo_order = false

# Release notes are for users: tests, CI plumbing and chores stay in the git history.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^docs", group = "Documentation" },
    { message = "^(test|ci|chore|build|style)", skip = true },
]
