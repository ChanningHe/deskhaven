# As about.toml, plus what upstream's older ring 0.16/0.17 needs for its OpenSSL-licensed part.

accepted = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

workarounds = ["ring"]

# Crate-specific tables must come last.
[ring]
accepted = ["OpenSSL"]
