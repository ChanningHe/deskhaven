# cargo-about configuration for the relay image's notice (hbbr, from the pinned upstream
# release's lockfile). Run through .github/release/notices-relay.sh. Same scope and
# accepted list as about.toml, plus what upstream's older dependency set needs:
# ring 0.16/0.17 carry an OpenSSL-licensed part (cargo-about's built-in clarification
# `ring` splits it out).

accepted = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

workarounds = ["ring"]

# Crate-specific tables must come last.
[ring]
accepted = ["OpenSSL"]
