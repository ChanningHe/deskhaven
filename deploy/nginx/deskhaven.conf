# Example server block for an existing nginx in front of deskhaven: a binary
# deployment with listen.client_api = "127.0.0.1:21114", or compose.yaml without
# the Caddy overlay (it publishes the HTTP ports on 127.0.0.1 only).
# Replace rd.example.com and the certificate paths.
#
# deskhaven must trust this proxy's X-Forwarded-For, or every client shares the
# proxy's address (rate limits, audit): set security.trusted_proxies to the
# address nginx connects from, e.g. 127.0.0.1 for a binary on the same host
# (env DESKHAVEN_SECURITY__TRUSTED_PROXIES=127.0.0.1/32).
# Rendezvous and relay (21115, 21116 TCP/UDP, 21117) are not HTTP: clients
# connect to them directly, not through nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name rd.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rd.example.com;

    ssl_certificate     /etc/letsencrypt/live/rd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rd.example.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Console + client API.
    location / {
        proxy_pass http://127.0.0.1:21114;
    }

    # wss for RustDesk clients: rendezvous (deskhaven) and relay (hbbr).
    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}
