# Example server block for an existing nginx in front of deskhaven: a binary
# deployment (../systemd/deskhaven.service listens on 127.0.0.1:21114), or
# compose.yaml without the Caddy overlay (it publishes the HTTP ports on
# 127.0.0.1 only). Replace rd.example.com and the certificate paths.
#
# deskhaven must trust this proxy's X-Forwarded-For, or every client shares the
# proxy's address (rate limits, audit): security.trusted_proxies is the address
# nginx connects from. Binary: 127.0.0.1/32 (set in the unit). Compose (rootful
# Docker): TRUSTED_PROXIES=172.30.114.1/32 in .env, the compose network gateway.
# Rendezvous and relay (21115, 21116 TCP/UDP, 21117) are not HTTP: clients
# connect to them directly, not through nginx.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Requests for any other host name are dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name rd.example.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rd.example.com;

    ssl_certificate     /etc/letsencrypt/live/rd.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rd.example.com/privkey.pem;

    # Server level only: a proxy_set_header inside a location would drop all
    # of these there, letting a client's own X-Forwarded-For through.
    # Overwritten, never appended: deskhaven trusts what this proxy sends.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Console + client API.
    location / {
        proxy_pass http://127.0.0.1:21114;
    }

    # wss for RustDesk clients: rendezvous (deskhaven) and relay (hbbr).
    location /ws/id {
        proxy_pass http://127.0.0.1:21118;
        proxy_read_timeout 120s;
    }
    location /ws/relay {
        proxy_pass http://127.0.0.1:21119;
        proxy_read_timeout 120s;
    }
}
