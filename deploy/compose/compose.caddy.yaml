# Overlay: Caddy in front with automatic HTTPS for the host in DESKHAVEN_PUBLIC_URL
# (DNS must point here, ports 80 and 443 reachable for the certificate).
#   443 -> deskhaven:21114 (console + client API)
#   wss /ws/id    -> deskhaven:21118 (rendezvous WebSocket)
#   wss /ws/relay -> relay:21119     (relay WebSocket)
# The HTTP ports of deskhaven and the relay are not published at all here: only
# Caddy reaches them, over the compose networks.

services:
  deskhaven:
    environment:
      # Only Caddy, at its fixed address below, may set X-Forwarded-For.
      DESKHAVEN_SECURITY__TRUSTED_PROXIES: 172.30.114.10/32
    ports: !override
      - "21115:21115/tcp"
      - "21116:21116/tcp"
      - "21116:21116/udp"

  relay:
    ports: !override
      - "21117:21117/tcp"

  caddy:
    # caddy:2.11, pinned by digest; bump both together.
    image: caddy:2.11@sha256:4fcafa98afd1c2e642e353e3c5cf9ddbe892fcee14bc990e7ba2c5b78e51f9cf
    restart: unless-stopped
    # Not on the relay: upstreams resolve per request, and the relay may still
    # be waiting for its key.
    depends_on: [deskhaven]
    environment:
      DESKHAVEN_PUBLIC_URL: ${DESKHAVEN_PUBLIC_URL:?set DESKHAVEN_PUBLIC_URL in .env}
    networks:
      default:
        ipv4_address: 172.30.114.10
      relay: {}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    # Caddy's image runs as root; it keeps only the capability to bind 80/443.
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    tmpfs:
      - /tmp:size=16m,mode=1777

volumes:
  caddy-data:
  caddy-config:
