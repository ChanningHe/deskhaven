# esbuild arrives through orval (API client generation, dev only). Its install
# script only re-checks the platform binary that pnpm already installs as an
# optional dependency, so it stays disabled.
#
# @bufbuild/buf (protobuf code generation for the remote client, dev only): its
# install script only checks the platform binary that pnpm already installs as an
# optional dependency, and otherwise downloads it with npm; the launcher in its bin
# finds the optional dependency without it.
allowBuilds:
  esbuild: false
  '@bufbuild/buf': false

# pnpm audit: orval's @scalar/json-magic pins undici 7.29 (GHSA-4qv8-2p9j-2685,
# GHSA-f72v-6w45-q472, GHSA-xjj6-f33q-929c, GHSA-4w7w-5xrc-9h26, GHSA-2m5v-pch6-74hx,
# GHSA-qrxm-fqhp-jwvm, GHSA-9fm3-97px-rjf6, GHSA-55wc-3pg8-jfw6); 7.30.1 is the same major.
overrides:
  'undici@>=7.0.0 <7.30.1': ^7.30.1
  # minimatch 10 (ts-morph via the shadcn CLI) is hit by
  # GHSA-g3hv-75wg-m249 (denial of service by globparts amplification); 11.0.1 is the fix.
  'minimatch@>=7.0.0 <11.0.1': ^11.0.1

# pnpm audit: accepted findings in dev-only tools, never in the built console.
auditConfig:
  ignoreGhsas:
    # deepmerge (shadcn CLI only, run by hand to add components): prototype poisoning of the
    # merged object; no patched version exists. Nothing at build or run time uses it.
    # Re-check by 2027-01-31, or on the next shadcn bump.
    - GHSA-gcqx-w48m-w2h4
