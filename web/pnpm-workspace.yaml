# pnpm 12 refuses to install package versions younger than its minimumReleaseAge
# (a supply-chain guard against freshly published, possibly compromised
# releases). The versions below were pinned within that window when the console
# was scaffolded (2026-11, M0-08), so pnpm recorded them as explicit exceptions.
# Remove each entry once that version is older than minimumReleaseAge (or when
# the dependency is bumped); `pnpm install --frozen-lockfile` must still pass.
minimumReleaseAgeExclude:
  - '@tanstack/query-core@5.105.1'
  - '@tanstack/react-query@5.105.1'
  - i18next@26.7.1
  - react-i18next@17.1.11
  - globals@17.14.0

# esbuild arrives through orval (API client generation, dev only). Its install
# script only re-checks the platform binary that pnpm already installs as an
# optional dependency, so it stays disabled.
allowBuilds:
  esbuild: false
