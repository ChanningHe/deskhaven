# Forgejo Actions CI for deskhaven (Forgejo 15, git.homielab.cc).
#
# No JavaScript actions are used: the job image (rust:*-bookworm) has no node, and
# bare `actions/*` resolution depends on the instance's DEFAULT_ACTIONS_URL. Sources
# are fetched with plain git (the repository is public; a private repo would need a
# token passed to the checkout step). No caching until a prebuilt CI image exists (M4-06).
#
# Runner label: every job uses `runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}`.
# To change it, set the repository/org variable CI_RUNNER_LABEL (Settings ->
# Actions -> Variables) or replace the 'ubuntu-latest' default in every `runs-on`
# line below. Jobs run inside the `container:` image, so the runner only needs
# Docker access (label must map to a docker-capable runner).
#
# Pipeline: fmt -> clippy + deny -> test {sqlite, postgres-16, postgres-17} + coverage;
# the web console job runs in parallel with all of it.
# The container image tag (repeated per job) must match the channel in rust-toolchain.toml.
# Network egress needed: git host, crates.io, Debian mirrors, Docker Hub,
# github.com (cargo-deny fetches the RustSec advisory DB from GitHub) and
# registry.npmjs.org (web job).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tool versions, defined once.
  CARGO_DENY_VERSION: "0.20.2"
  CARGO_LLVM_COV_VERSION: "0.9.1"
  # The pnpm of the Nix devshell (flake.lock); web/package.json deliberately has no
  # packageManager field (see web/README.md).
  PNPM_VERSION: "12.9.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Warnings are denied in exactly one place: clippy `-D warnings` (with --all-targets it
  # also covers test code). No global RUSTFLAGS, so `cargo install` of tools is unaffected.
  #
  # Checkout inputs: PRs fetch refs/pull/N/head, pushes fetch the commit (ref as fallback).
  CI_REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
  CI_FETCH_REF: ${{ github.event.pull_request.number && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}
  CI_FALLBACK_REF: ${{ github.ref }}

jobs:
  fmt:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      # Toolchain only (rustfmt); no apt packages needed.
      - run: CI_SKIP_APT=1 .forgejo/ci-setup.sh
      - run: cargo fmt --all -- --check

  # Web console (web/): lint + format, types, translations, tests, generated-code
  # drift and the production build. Needs nothing from the Rust jobs: the API client
  # is generated from the committed openapi.json, whose own drift test-sqlite checks.
  web:
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    # Major version only: web/package.json requires node >= 24 (engine-strict).
    container: node:24-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - name: pnpm
        run: |
          npm install -g --no-fund --no-audit "pnpm@$PNPM_VERSION"
          node --version
          pnpm --version
      # Same as `xtask dist`: dependency install scripts never run.
      - run: pnpm -C web install --frozen-lockfile --ignore-scripts
      - run: pnpm -C web lint
      - run: pnpm -C web typecheck
      # Fails on a key missing from a locale or {{placeholders}} that differ.
      - run: pnpm -C web i18n:check
      - run: pnpm -C web test
      - name: generated API client matches openapi.json
        run: |
          pnpm -C web gen:api
          git status --porcelain -- web/src/api/generated
          test -z "$(git status --porcelain -- web/src/api/generated)"
      - name: build (and the committed route tree is current)
        run: |
          pnpm -C web build
          git diff --exit-code -- web/src/routeTree.gen.ts

  clippy:
    needs: fmt
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .forgejo/ci-setup.sh
      - run: cargo clippy --workspace --all-targets -- -D warnings

  deny:
    needs: fmt
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: CI_SKIP_APT=1 .forgejo/ci-setup.sh cargo-deny@${{ env.CARGO_DENY_VERSION }}
      - run: cargo deny check

  test-sqlite:
    needs: [clippy, deny]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .forgejo/ci-setup.sh
      # DESKHAVEN_TEST_PG_URL is deliberately unset: PG-parameterised tests are skipped.
      - run: cargo test --workspace --all-targets --no-fail-fast
      # The committed admin API OpenAPI document must match the code (the console's
      # types are generated from it). Reuses the test build; only xtask itself links.
      - run: cargo xtask gen-openapi --check

  test-postgres:
    needs: [clippy, deny]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    strategy:
      fail-fast: false
      matrix:
        pg: ["16", "17"]
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI-only credentials for the service container above.
      DESKHAVEN_TEST_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_test
      # The DB test helper panics (instead of skipping PG) if the URL is missing.
      DESKHAVEN_TEST_REQUIRE_PG: "1"
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .forgejo/ci-setup.sh
      - run: cargo test --workspace --all-targets --no-fail-fast

  # Runs in parallel with the tests; report only.
  coverage:
    needs: [clippy, deny]
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-latest' }}
    container: rust:1.99.1-bookworm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deskhaven
          POSTGRES_PASSWORD: deskhaven
          POSTGRES_DB: deskhaven_test
        options: >-
          --health-cmd "pg_isready -U deskhaven"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DESKHAVEN_TEST_PG_URL: postgres://deskhaven:deskhaven@postgres:5432/deskhaven_test
      DESKHAVEN_TEST_REQUIRE_PG: "1"
    steps:
      - name: checkout
        run: |
          git init -q .
          git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FETCH_REF" || git fetch -q --depth=1 "$CI_REPO_URL" "$CI_FALLBACK_REF"
          git checkout -q FETCH_HEAD
      - run: .forgejo/ci-setup.sh cargo-llvm-cov@${{ env.CARGO_LLVM_COV_VERSION }}
      # Report only until the end of M2. To enforce the gate, append
      # `--fail-under-lines 80` to the command below.
      - run: cargo llvm-cov --workspace --all-targets --no-fail-fast --summary-only # --fail-under-lines 80
