# cargo-deny policy. Run: cargo deny check

[graph]
all-features = true

[licenses]
# deskhaven itself is AGPL-3.0-only; every dependency license must be compatible.
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (bundled Mozilla CA roots, via sqlx rustls)
]

# Inferred, not stated: rustdesk-server's debian/copyright makes "Files: *" AGPL-3.0 and
# carried hbb_common as a submodule. The version has stayed 0.1.0 for long, so re-check for
# a license field or file on every rev bump.
[[licenses.clarify]]
crate = "hbb_common@=0.1.0"
expression = "AGPL-3.0-or-later"
license-files = []

# Assumed, not granted: authored by the RustDesk org and only consumed by AGPL-3.0 projects;
# pending an upstream license statement.
[[licenses.clarify]]
crate = "default_net"
expression = "AGPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not wildcards.
allow-wildcard-paths = true
deny = [
    # TLS backend is rustls with the ring provider only.
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    # Only through hbb_common, which depends on native-tls unconditionally.
    { crate = "openssl", wrappers = ["native-tls"] },
    { crate = "openssl-sys", wrappers = ["native-tls", "openssl"] },
    { crate = "native-tls", wrappers = ["tokio-native-tls", "tungstenite", "tokio-tungstenite"] },
    { crate = "tokio-native-tls", wrappers = ["hbb_common", "tokio-tungstenite"] },
    # Exactly one libsqlite3-sys: its `links` key forbids duplicates.
    { crate = "libsqlite3-sys", deny-multiple-versions = true },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2021-0137", reason = "sodiumoxide is pulled in by hbb_common; protocol compatibility requires it" },
    # These arrive via hbb_common and cannot be upgraded without forking it; re-check
    # each against its source on every hbb_common bump.
    { id = "RUSTSEC-2025-0040", reason = "users 0.11: hbb_common only re-exports the crate and never calls it; deskhaven does not use it, so the group-listing bug is unreachable" },
    { id = "RUSTSEC-2023-0040", reason = "users 0.11 unmaintained: re-exported by hbb_common, never called (see RUSTSEC-2025-0040)" },
    { id = "RUSTSEC-2023-0059", reason = "users 0.11 unsound (unaligned read of a c_char pointer in the group-listing code): re-exported by hbb_common, never called (see RUSTSEC-2025-0040); `cargo audit bin` denies unsound findings, `cargo deny` only reports them for workspace crates" },
    { id = "RUSTSEC-2023-0051", reason = "dlopen_derive unmaintained: compile-time proc-macro of dlopen, which hbb_common re-exports but deskhaven does not use" },
    { id = "RUSTSEC-2021-0139", reason = "ansi_term unmaintained: build-time only (clap 2 <- bindgen 0.59 <- machine-uid build script)" },
    { id = "RUSTSEC-2024-0375", reason = "atty unmaintained: build-time only (clap 2 / env_logger 0.9 <- bindgen 0.59 <- machine-uid build script)" },
    { id = "RUSTSEC-2021-0145", reason = "atty unsound (unaligned read on Windows only): build-time only, as RUSTSEC-2024-0375; listed for `cargo audit` of the workspace lockfile (M4-05), `cargo deny` only reports unsound advisories of workspace crates" },
    # deskhaven holds no RSA private key; only the OIDC tests sign, with throwaway keys.
    { id = "RUSTSEC-2023-0071", reason = "rsa: only public-key signature verification of ID tokens in production; Marvin concerns private-key operations" },
    # Moving to jiff/time is a migration, not a patch-release change.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained, no known vulnerability; required by sea-orm/sqlx/openidconnect/hbb_common; migration tracked separately" },
    # A replacement must accept the same duration syntax, so it waits with chrono.
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained (wraps chrono), no known vulnerability; config duration syntax depends on it" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Some of these are branch-tracked by hbb_common and pinned only by Cargo.lock: review
# them on every hbb_common bump.
allow-git = [
    "https://github.com/rustdesk/hbb_common",
    "https://github.com/rustdesk-org/tokio-tungstenite",
    "https://github.com/rustdesk-org/confy",
    "https://github.com/rustdesk-org/default_net",
    "https://github.com/rustdesk-org/machine-uid",
    "https://github.com/rustdesk-org/sysinfo",
    "https://github.com/rustdesk-org/tokio-socks",
]
