# cargo-deny policy. Run: cargo deny check
# Global constraints: dev/docs/02-architecture.md section 5.1.

[graph]
all-features = true

[licenses]
# deskhaven itself is AGPL-3.0-only; every dependency license must be compatible.
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
    "AGPL-3.0-only",
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0", # webpki-roots (bundled Mozilla CA roots, via sqlx rustls)
]

# Git crates that declare no license and ship no license file.
# hbb_common: INFERENCE, not a stated license: rustdesk-server's debian/copyright says
# "Files: *" are AGPL-3.0 ("or any later version"), and that tree carried hbb_common as
# its libs/hbb_common submodule. The version pin makes this clarification stop matching
# (and the crate fail as unlicensed) on any version change; hbb_common has stayed at 0.1.0
# for a long time, so also re-check for a license field/file on every rev bump.
[[licenses.clarify]]
crate = "hbb_common@=0.1.0"
expression = "AGPL-3.0-or-later"
license-files = []

# ASSUMPTION, not a grant: rustdesk-org/default_net (original crate, not a fork; no license
# file or field as of 78f8f70) is authored by the RustDesk org and only consumed by AGPL-3.0
# projects (rustdesk client, hbb_common); treated as AGPL-3.0-or-later pending an upstream
# license statement.
[[licenses.clarify]]
crate = "default_net"
expression = "AGPL-3.0-or-later"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies are not wildcards.
allow-wildcard-paths = true
deny = [
    # TLS backend is rustls with the ring provider only.
    { crate = "aws-lc-rs" },
    { crate = "aws-lc-sys" },
    # OpenSSL only through hbb_common's native-tls stack: documented exception, see
    # dev/docs/02-architecture.md section 5.1 ("openssl exception"). hbb_common
    # unconditionally depends on native-tls (proxy and wss fallback paths).
    # deskhaven's own code still uses rustls + ring only.
    { crate = "openssl", wrappers = ["native-tls"] },
    { crate = "openssl-sys", wrappers = ["native-tls", "openssl"] },
    { crate = "native-tls", wrappers = ["tokio-native-tls", "tungstenite", "tokio-tungstenite"] },
    { crate = "tokio-native-tls", wrappers = ["hbb_common", "tokio-tungstenite"] },
    # Exactly one libsqlite3-sys (duplicates are an error), and it must stay
    # below 0.38 (sqlx constraint).
    { crate = "libsqlite3-sys", deny-multiple-versions = true },
    { crate = "libsqlite3-sys@>=0.38" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # sodiumoxide is unmaintained; it arrives via hbb_common (RustDesk protocol
    # crate) which we must stay wire-compatible with. Accepted, documented risk.
    { id = "RUSTSEC-2021-0137", reason = "sodiumoxide is pulled in by hbb_common; protocol compatibility requires it" },
    # The entries below all arrive via hbb_common (rev fae47e0) and cannot be
    # upgraded without forking it. Each was checked against hbb_common's source;
    # re-check on every hbb_common bump.
    { id = "RUSTSEC-2025-0040", reason = "users 0.11: hbb_common only re-exports the crate and never calls it; deskhaven does not use it, so the group-listing bug is unreachable" },
    { id = "RUSTSEC-2023-0040", reason = "users 0.11 unmaintained: re-exported by hbb_common, never called (see RUSTSEC-2025-0040)" },
    { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 (fix needs 0.14, semver-incompatible with hbb_common): hbb_common never uses the with_context stream constructors" },
    { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7.4: Seekable API only; the `seekable` feature is not enabled" },
    { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7.4 DCtx::decompress_stream: only the write-side zstd::stream::write::Decoder exposes it; hbb_common's compress.rs uses the read-side zstd::Decoder::new, which the advisory lists as unaffected; revisit when hbb_common upgrades zstd" },
    { id = "RUSTSEC-2023-0051", reason = "dlopen_derive unmaintained: compile-time proc-macro of dlopen, which hbb_common re-exports but deskhaven does not use" },
    { id = "RUSTSEC-2021-0139", reason = "ansi_term unmaintained: build-time only (clap 2 <- bindgen 0.59 <- machine-uid build script)" },
    { id = "RUSTSEC-2024-0375", reason = "atty unmaintained: build-time only (clap 2 / env_logger 0.9 <- bindgen 0.59 <- machine-uid build script)" },
    # rsa 0.9 via openidconnect 4.1 (M2-10). The Marvin attack leaks timing of operations
    # with the RSA *private* key (decryption, signing). deskhaven holds no RSA private key:
    # it only verifies IdP ID token signatures with public JWKS keys (RS*/PS*), which the
    # advisory does not affect. Only the OIDC tests sign, with throwaway fixture keys.
    { id = "RUSTSEC-2023-0071", reason = "rsa: only public-key signature verification of ID tokens in production; Marvin concerns private-key operations" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# hbb_common (pinned by rev in Cargo.toml) and the rustdesk-org forks it pulls in.
# confy, default_net, machine-uid, tokio-socks and sysinfo are branch-tracked by
# hbb_common; Cargo.lock pins their commits. Review these on every hbb_common bump.
allow-git = [
    "https://github.com/rustdesk/hbb_common",
    "https://github.com/rustdesk-org/tokio-tungstenite",
    "https://github.com/rustdesk-org/confy",
    "https://github.com/rustdesk-org/default_net",
    "https://github.com/rustdesk-org/machine-uid",
    "https://github.com/rustdesk-org/sysinfo",
    "https://github.com/rustdesk-org/tokio-socks",
]
