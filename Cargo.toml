[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/deskhaven"]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
deskhaven-config = { path = "crates/deskhaven-config" }
deskhaven-db = { path = "crates/deskhaven-db" }
deskhaven-core = { path = "crates/deskhaven-core" }
deskhaven-client-api = { path = "crates/deskhaven-client-api" }
deskhaven-admin-api = { path = "crates/deskhaven-admin-api" }
deskhaven-web = { path = "crates/deskhaven-web" }
deskhaven-signal = { path = "crates/deskhaven-signal" }
deskhaven-contract = { path = "crates/deskhaven-contract" }

# --- db (M0-04) ---
# sqlx 0.9 `tls-rustls` == `tls-rustls-ring-webpki`: ring provider only, no aws-lc-rs.
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-chrono", "runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
# --- config (M0-03) ---
figment = { version = "0.10.19", features = ["toml", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
humantime = "2.2"
ipnet = "2.11"
bytesize = "2.0"
url = "2.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }
toml = "0.8"

# --- signal (M1-02) ---
# (chrono, tempfile: reused from the db block; serde, serde_json: from the config block.)
# Pinned to the rev the RustDesk client master pins; bump together with the client.
# Its default feature set is already empty (the only feature is the optional `webrtc`).
hbb_common = { git = "https://github.com/rustdesk/hbb_common", rev = "fae47e024dd83cef6aaecde0aa7d11731df11649" }
# Same fork and rev as hbb_common's, so Cargo unifies both into a single copy.
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29" }
tungstenite = "0.29"
# Upstream hbbs version. Since M1-03 only `encode` (licence key from the public key) remains;
# key-file parsing moved out of the crate (M0-06). Do not use in new code.
base64 = "0.13"
ipnetwork = "0.20"
lazy_static = "1.5"
local-ip-address = "0.5.1"
once_cell = "1.8"
serde_derive = "1.0"
sodiumoxide = "0.2"
uuid = { version = "1.16", features = ["v4"] }
# --- core crypto (M0-06) ---
# RustCrypto only (no libsodium): XChaCha20-Poly1305 SecretBox, Ed25519 hbbs key pair.
# (thiserror, tempfile: reused from the db block.)
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2"
zeroize = "1.8"
sha2 = "0.10"
# `base64` is taken by the signal block (0.13, legacy API, lenient padding). New code
# needs 0.22's engines (strict unpadded decoding for sealed strings), hence its own key.
base64_022 = { package = "base64", version = "0.22" }
# Safe O_NOFOLLOW open and geteuid for key-file hardening (already in the tree via tempfile).
rustix = { version = "1.1", features = ["fs", "process"] }
# --- settings (M0-05) ---
# Lock-free hot snapshot of runtime settings (05-config §3.3).
# (tokio, serde_json, sea-orm, thiserror: reused from the db/config blocks; tokio's `sync`
# feature for `watch` is enabled by the consuming crate.)
arc-swap = "1.9"

# --- signal lib (M1-03) ---
# (thiserror: reused from the db block.)
# CancellationToken (public `run` API) and TaskTracker (`rt`); same 0.7 line hbb_common uses.
tokio-util = { version = "0.7", features = ["rt"] }

# --- http (M0-07) ---
# (tokio, tokio-util, serde, serde_json, thiserror, ipnet, url, tracing-subscriber, uuid: reused from earlier blocks.)
deskhaven-http = { path = "crates/deskhaven-http" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
hyper = { version = "1.12", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "limit", "trace"] }
tracing = "0.1.44"
proptest = "1.7"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
