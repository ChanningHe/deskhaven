[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/deskhaven"]

[workspace.package]
version = "0.2.0-rc.5"
edition = "2024"
rust-version = "1.94"
license = "AGPL-3.0-only"
publish = false

[workspace.dependencies]
deskhaven-config = { path = "crates/deskhaven-config" }
deskhaven-db = { path = "crates/deskhaven-db" }
deskhaven-core = { path = "crates/deskhaven-core" }
deskhaven-client-api = { path = "crates/deskhaven-client-api" }
deskhaven-admin-api = { path = "crates/deskhaven-admin-api" }
deskhaven-web = { path = "crates/deskhaven-web" }
deskhaven-signal = { path = "crates/deskhaven-signal" }
deskhaven-contract = { path = "crates/deskhaven-contract" }
deskhaven-loadgen = { path = "crates/deskhaven-loadgen" }

# sqlx 0.9 `tls-rustls` is ring only, no aws-lc-rs.
sea-orm = { version = "2.0.4", default-features = false, features = ["macros", "with-chrono", "runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "sqlx-postgres"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
thiserror = "2"
tokio = { version = "1.54", features = ["macros", "rt-multi-thread", "time"] }
tempfile = "3"
figment = { version = "0.10.19", features = ["toml", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
schemars = "1.0"
humantime = "2.2"
ipnet = "2.11"
bytesize = "2.0"
url = "2.5"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["env-filter"] }
toml = "0.8"

# The rev the RustDesk client pins; bump together with the client.
hbb_common = { git = "https://github.com/rustdesk/hbb_common", rev = "fae47e024dd83cef6aaecde0aa7d11731df11649" }
# Same fork and rev as hbb_common's, so Cargo unifies both into a single copy.
tokio-tungstenite = { git = "https://github.com/rustdesk-org/tokio-tungstenite", rev = "c241b11b03de4881faf1ecd2fe6e867c92f3013b", version = "0.29" }
tungstenite = "0.29"
# Upstream hbbs's version; new code uses `base64_022`.
base64 = "0.13"
ipnetwork = "0.20"
lazy_static = "1.5"
local-ip-address = "0.5.1"
once_cell = "1.8"
serde_derive = "1.0"
sodiumoxide = "0.2"
uuid = { version = "1.16", features = ["v4"] }
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2"
zeroize = "1.8"
sha2 = "0.10"
# 0.22's strict unpadded decoding for sealed strings.
base64_022 = { package = "base64", version = "0.22" }
# O_NOFOLLOW open and geteuid for key-file hardening.
rustix = { version = "1.1", features = ["fs", "process"] }

# Same 0.7 line hbb_common uses.
tokio-util = { version = "0.7", features = ["rt"] }
# Listeners without SO_REUSEPORT, which hbb_common's helpers always set.
socket2 = "0.6"

deskhaven-http = { path = "crates/deskhaven-http" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
hyper = { version = "1.12", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1.21", default-features = false, features = ["http1", "server", "server-graceful", "service", "tokio"] }
tower = { version = "0.5.3", default-features = false }
tower-http = { version = "0.7.1", default-features = false, features = ["catch-panic", "limit", "trace"] }
tracing = "0.1.44"
proptest = "1.7"

arc-swap = "1.9"

# `include-exclude` keeps source maps and dotfiles out of the embed.
rust-embed = { version = "8.13", default-features = false, features = ["mime-guess", "include-exclude"] }

# Only to install ring as the process-wide CryptoProvider; never aws-lc.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

# No `rand` feature: salts come from the OS RNG core already uses.
argon2 = { version = "0.5.3", default-features = false, features = ["std", "password-hash", "zeroize"] }

# `PeerStore` is used as `Arc<dyn PeerStore>`, so its async methods need boxing.
async-trait = "0.1"

# Never tower_governor: it trusts XFF. No `quanta`: time comes from core's `Clock`.
governor = { version = "0.10.4", default-features = false, features = ["std"] }

# TOTP is a dozen lines over HMAC-SHA1, so no TOTP crate. hmac 0.13 only takes
# digest-0.11 hashes, hence `sha2_011` next to sha2 0.10.
hmac = { version = "0.13", default-features = false }
sha1 = { version = "0.11", default-features = false }
sha2_011 = { package = "sha2", version = "0.11", default-features = false }
data-encoding = "2.11"
# Constant-time comparison of TOTP codes and admin CSRF tokens.
subtle = { version = "2.6", default-features = false }

utoipa = { version = "6.0", default-features = false, features = ["macros"] }
utoipa-axum = "0.3"
garde = { version = "0.23", default-features = false, features = ["derive"] }

# Pure-Rust backend, so no C code.
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }

# Its `reqwest` feature would pin reqwest 0.12 with aws-lc. `accept-string-booleans`:
# some IdPs send `email_verified` as a string, which otherwise fails to parse.
openidconnect = { version = "4.1.0", default-features = false, features = ["accept-string-booleans"] }
# `rustls-no-provider`: TLS is built explicitly on ring with the platform verifier.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
# The same version reqwest's rustls path uses.
rustls-platform-verifier = "0.6.2"
wiremock = "0.6.5"

http-body-util = "0.1.3"
fastrand = "2.3"

qrcodegen = "1.8"

semver = "1.0.28"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Argon2 is unusably slow unoptimized, and tests hash with the production parameters.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# The bundled SQLite is C code: unoptimized it is several times slower, which skews the
# timing of the audit list tests and slows every SQLite-backed test.
[profile.dev.package.libsqlite3-sys]
opt-level = 3
