# The three suites run side by side; timing-sensitive tests fail on an oversubscribed machine.
[profile.ci]
fail-fast = false
test-threads = 16
retries = 1

[profile.ci-pg]
fail-fast = false
test-threads = 8
retries = 1

# A PostgreSQL test holds up to 9 connections; the server allows 100.
[test-groups]
postgres = { max-threads = 10 }

[[profile.ci-pg.overrides]]
filter = 'rdeps(deskhaven-db)'
test-group = 'postgres'
