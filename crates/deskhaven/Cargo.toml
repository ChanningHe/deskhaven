[package]
name = "deskhaven"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deskhaven-admin-api = { workspace = true }
deskhaven-client-api = { workspace = true }
deskhaven-config = { workspace = true }
deskhaven-core = { workspace = true }
deskhaven-db = { workspace = true }
deskhaven-http = { workspace = true }
deskhaven-web = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
sea-orm = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["net", "signal"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "tracing-log"] }

[dev-dependencies]
base64_022 = { workspace = true }
