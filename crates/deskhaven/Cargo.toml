[package]
name = "deskhaven"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deskhaven-admin-api = { workspace = true }
deskhaven-client-api = { workspace = true }
deskhaven-config = { workspace = true }
deskhaven-core = { workspace = true }
deskhaven-db = { workspace = true }
deskhaven-http = { workspace = true }
deskhaven-web = { workspace = true }
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
rustls = { workspace = true }
sea-orm = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["net", "signal", "sync"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "json", "tracing-log"] }
# signal peer store adapter (M1-05); signal server wiring (M1-06: the hbbs key in
# sodiumoxide's layout for `SignalConfig::secret_key`)
deskhaven-signal = { workspace = true }
async-trait = { workspace = true }
sodiumoxide = { workspace = true }

[dev-dependencies]
base64_022 = { workspace = true }
tempfile = { workspace = true }
deskhaven-db = { workspace = true, features = ["testing"] }
hbb_common = { workspace = true }
# Fault injection for the supervisor tests (`SignalHandle::inject_fault`).
deskhaven-signal = { workspace = true, features = ["testing"] }
# tests/loadgen.rs: the load generator (M4-04) against this binary.
deskhaven-loadgen = { workspace = true }

# umask, flock on the instance lock; tests also send signals with it.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[lints]
workspace = true
