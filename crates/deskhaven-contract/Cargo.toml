[package]
name = "deskhaven-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# Test support only: client-mirror types and the fixture runner. It depends on
# the server (to replay fixtures through the real router); production crates
# must never depend on it (enforced by tests/no_production_dependents.rs).
[dependencies]
deskhaven = { path = "../deskhaven" }
deskhaven-admin-api = { workspace = true }
deskhaven-config = { workspace = true }
deskhaven-core = { workspace = true }
# Seeds and flow tests write rows no service offers (device owner, group), and read them back.
deskhaven-db = { workspace = true }
deskhaven-http = { workspace = true }
anyhow = { workspace = true }
flate2 = { workspace = true }
axum = { workspace = true }
sea-orm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true, features = ["util"] }
# OidcAuthUrl.url is a url::Url in the client.
url = { workspace = true, features = ["serde"] }

[dev-dependencies]
deskhaven-client-api = { workspace = true }
# The mock IdP shared with the core tests (deskhaven-core/tests/common/oidc_idp.rs).
base64_022 = { workspace = true }
chrono = { workspace = true }
openidconnect = { workspace = true }
sha2 = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
