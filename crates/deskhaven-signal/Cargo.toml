[package]
name = "deskhaven-signal"
version.workspace = true
# Upstream hbbs is edition 2021; the 2024 drop-order changes were reviewed (CHANGES.md, M1-03).
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test-only fault injection (`SignalHandle::inject_fault`) for embedders' supervision tests.
testing = []
# Fuzzing entry points into the message handlers (`fuzzing::Harness`, fuzz/ targets).
fuzzing = []

[dependencies]
# Relay list shared lock-free by the server loop and every connection task (M1-06).
arc-swap.workspace = true
async-trait.workspace = true
base64.workspace = true
hbb_common.workspace = true
ipnetwork.workspace = true
lazy_static.workspace = true
local-ip-address.workspace = true
once_cell.workspace = true
sodiumoxide.workspace = true
# TCP listeners without SO_REUSEPORT (M1-08).
socket2.workspace = true
thiserror.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tungstenite.workspace = true

[dev-dependencies]
# Random device uuids in the protocol test harness.
uuid.workspace = true
# Lowers the open-file limit in the descriptor exhaustion test (M4-05).
rustix.workspace = true
# Paused clock for the writer retry / deadline unit tests.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true
