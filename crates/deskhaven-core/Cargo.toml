[package]
name = "deskhaven-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
deskhaven-config = { workspace = true }
base64_022 = { workspace = true }
chacha20poly1305 = { workspace = true }
ed25519-dalek = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }
deskhaven-db = { workspace = true }
arc-swap = { workspace = true }
sea-orm = { workspace = true }
serde_json = { workspace = true }
# `net`: DNS lookups of the OIDC resolver (filtered, see `oidc::resolver`).
tokio = { workspace = true, features = ["sync", "net"] }
argon2 = { workspace = true }
tracing = { workspace = true }
governor = { workspace = true }
chrono = { workspace = true }
hmac = { workspace = true }
sha1 = { workspace = true }
sha2_011 = { workspace = true }
data-encoding = { workspace = true }
subtle = { workspace = true }
# Address book guids are UUIDv7 strings (04 §1).
uuid = { workspace = true, features = ["v7"] }
openidconnect = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
rustls-platform-verifier = { workspace = true }
url = { workspace = true }
serde = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
deskhaven-db = { workspace = true, features = ["testing"] }
tracing-subscriber = { workspace = true, features = ["fmt"] }
wiremock = { workspace = true }

[lints]
workspace = true
